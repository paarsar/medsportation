# fly.toml app configuration file generated for medsportation-be on 2026-05-02T09:44:00-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'medsportation-be'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_PATH = '/data/medsportation.db'
  GIN_MODE = 'release'
  SMTP_HOST = 'smtp.office365.com'
  SMTP_PORT = '587'

[[mounts]]
  source = 'sqlite_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
