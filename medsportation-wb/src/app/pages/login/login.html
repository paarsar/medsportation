<div class="min-h-[calc(100vh-200px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white dark:bg-slate-900 p-10 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800">
    <div>
      <div class="flex justify-center text-primary mb-4">
        <span class="material-symbols-outlined !text-5xl">lock_open</span>
      </div>
      <h2 class="mt-6 text-center text-3xl font-black text-slate-900 dark:text-white tracking-tight">
        Admin Login
      </h2>
      <p class="mt-2 text-center text-sm text-slate-500">
        Access the Medsportation Dashboard
      </p>
    </div>
    
    <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg text-sm">
      {{ error }}
    </div>

    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="username" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Username</label>
          <input formControlName="username" id="username" type="text" required class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-slate-300 dark:border-slate-700 dark:bg-slate-800 placeholder-slate-400 text-slate-900 dark:text-white focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm" placeholder="Username">
        </div>
        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Password</label>
          <input formControlName="password" id="password" type="password" required class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-slate-300 dark:border-slate-700 dark:bg-slate-800 placeholder-slate-400 text-slate-900 dark:text-white focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm" placeholder="Password">
        </div>
      </div>

      <div>
        <button [disabled]="loading || loginForm.invalid" type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-primary hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 transition-colors">
          <span *ngIf="!loading">Sign in</span>
          <span *ngIf="loading" class="flex items-center gap-2">
            <span class="animate-spin size-4 border-2 border-white border-t-transparent rounded-full"></span>
            Authenticating...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
